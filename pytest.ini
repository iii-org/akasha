[pytest]

pythonpath = .
testpaths = tests
addopts = -vv --basetemp=.pytest-tmp

markers =
    unit: fast unit tests without network or provider dependencies
    integration: tests that combine real local components without external services
    live: tests that contact external networks or real services
    contract: public API, schema, serialization, or compatibility contracts
    upgrade: smoke tests used before and after dependency upgrades
    requires_api: tests that require external provider API keys
    full_only: tests that require full local-model dependencies
    smoke: minimal end-to-end validation for critical paths
    agent: agent-related tests
    ask: ask-related tests
    cli: command-line interface tests
    compatibility: cross-feature compatibility tests
    db: database and persistence tests
    eval: evaluation tests
    mcp: MCP tests
    memory: memory tests
    observability: logging and observability tests
    provider: model and embedding provider tests
    rag: retrieval-augmented generation tests
    skill: skill-loading and skill-runtime tests
    summary: summary tests
    tool: tool schema and execution tests
    vision: image generation and understanding tests
    
