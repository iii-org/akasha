site_name: akasha User Guide
site_description: A practical guide to chat, RAG, agents, streaming, and memory with akasha.
site_url: https://iii-org.github.io/akasha/
docs_dir: user-guide

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          nav_translations:
            Home: 首頁
            Getting started: 開始使用
            Core concepts: 核心概念
            Tutorials: 使用教學
            Troubleshooting: 疑難排解
            API Reference: API 參考
            API overview: API 總覽
            ask: ask
            RAG: RAG
            agents: agents
            summary: summary
            MemoryManager: MemoryManager
            Evaluation: 模型評估
            eval: eval
            Token counting: Token 計算
            Embeddings: Embedding
            MCP: MCP
            Tool (call function): Tool（呼叫函式）
            SKILL: SKILL
            What akasha provides: akasha 功能
            Choosing an API: 選擇 API 功能
            Installation: 安裝
            Configure a model provider: 設定模型 Provider
            First chat with ask: 第一個 ask 對話
            Build a RAG workflow: 建立 RAG 流程
            Build an agent and use tools: 建立 Agent
            Streaming events: 串流事件
            FAQ: 常見問題
          site_name: akasha 使用說明
          site_description: akasha 聊天、RAG、Agent、Streaming 與記憶功能的使用指南。

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Configure a model provider: getting-started/providers.md
      - First chat with ask: getting-started/first-chat.md
  - Core concepts:
      - What akasha provides: concepts/overview.md
      - Choosing an API: concepts/choosing-an-api.md
  - Tutorials:
      - Build a RAG workflow: tutorials/rag.md
      - Streaming events: tutorials/streaming.md
      - Evaluation: tutorials/evaluation.md
      - Token counting: tutorials/token-counting.md
      - Embeddings: tutorials/embeddings.md
      - Build an agent and use tools:
          - Tool (call function): tutorials/agents.md
          - MCP: tutorials/mcp.md
          - SKILL: tutorials/skill.md
  - API Reference:
      - API overview: reference/index.md
      - ask: reference/ask.md
      - RAG: reference/rag.md
      - agents: reference/agents.md
      - summary: reference/summary.md
      - MemoryManager: reference/memory-manager.md
      - eval: reference/eval.md
      - myTokenizer: reference/my-tokenizer.md
      - handle_embeddings: reference/handle-embeddings.md
  - Troubleshooting:
      - FAQ: troubleshooting/faq.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iii-org/akasha

copyright: akasha is released under the MIT License.
