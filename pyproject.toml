[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akasha_terminal"
version = "1.8.0"
description = "document QA(RAG) package using langchain and chromadb"
readme = "README.md"
authors = [{ name = "chih chuan chang", email = "ccchang@iii.org.tw" }]
requires-python = ">=3.11,<3.13"

# 核心相依（環境標記依照原本的平台分流）
dependencies = [
  "pypdf",
  "langchain-core>=1.3,<2.0",
  "langchain>=1.3,<2.0",
  "langchain-experimental>=0.4,<0.5",
  "langchain-community>=0.4.1,<0.5",
  "langchain-classic>=1.0,<2.0",
  "langchain_openai>=1.0,<2.0",
  "langchain-google-genai>=4.0,<5.0",
  "langchain-ollama>=1.0,<2.0",
  "langchain-anthropic>=1.0,<2.0",
  "langchain-text-splitters>=1.1,<2.0",
  "langchain-chroma>=1.1,<2.0",
  "chromadb>=0.5.3",
  "openai>=1.78.1",
  "posthog<6.0.0",
  "tiktoken",
  "scikit-learn>=1.3.0",
  "jieba3>=1.0.2",
  "opencc-python-reimplemented==0.1.7",
  "tqdm>=4.65.0",
  "docx2txt==0.8",
  "rouge==1.0.1",
  "rouge-chinese==1.0.3",
  "click",
  "rank_bm25",
  "wikipedia",
  "numpy>=2,<3",
  "google-genai>=1.15.0",
  "anthropic",
  "tavily-python",
  "langchain-mcp-adapters>=0.2,<0.3",
  "mcp>=1.24,<2.0",
  "json_repair",
  "jsonpatch>=1.33",
  "python-dotenv",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
light = []
ui = [
  "streamlit>=1.33.0",
  "streamlit_option_menu>=0.3.6",
]
tracking = ["mlflow"]
documents = [
  "unstructured",
  "python-pptx",
]
faiss = ["faiss-cpu"]
full = [
  "streamlit>=1.33.0",
  "streamlit_option_menu>=0.3.6",
  "mlflow",
  "unstructured",
  "python-pptx",
  "faiss-cpu",
  "langchain-huggingface>=1.0,<2.0",
  "onnxruntime>=1.20,<2.0",
  "sentence-transformers>=6.0,<7.0",
  "transformers>=5.0,<6.0",
  "accelerate>=1.7,<2.0",
  "bert-score==0.3.13",
  "sentencepiece",
  "torch>=2.4,<3.0",
  "torchvision>=0.19,<1.0",
  "llama-cpp-python==0.3.8",
  "peft>=0.17,<1.0",
  "gptqmodel>=7.0,<8.0",
]
llama-cpp = ["llama-cpp-python==0.3.8"]
peft = [
  "peft>=0.17,<1.0",
  "transformers>=5.0,<6.0",
  "accelerate>=1.7,<2.0",
  "torch>=2.4,<3.0",
]
gptq = [
  "gptqmodel>=7.0,<8.0",
  "transformers>=5.0,<6.0",
  "torch>=2.4,<3.0",
]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[project.scripts]
akasha = "cli.glue:akasha"

[project.urls]
Homepage = "https://github.com/iii-org/akasha"


[tool.setuptools.packages.find]
include = ["akasha", "akasha.*", "cli"]

[tool.setuptools.package-data]
akasha = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast unit tests without network or provider dependencies",
  "integration: broader tests that may touch real package integrations",
  "upgrade: smoke tests used before and after dependency upgrades",
  "requires_api: tests that require external provider API keys",
  "full_only: tests that require full local-model dependencies",
  "smoke: minimal end-to-end validation for critical paths",
  "agent: agent-related tests",
  "akasha: legacy top-level Akasha integration tests",
  "db: database and persistence tests",
  "eval: evaluation tests",
  "summary: summary tests",
  "helper: shared test helper and coverage utilities",
]

[tool.coverage.run]
source = [
  "akasha.helper",
  "akasha.utils.db",
  "akasha.utils.search",
  "akasha.tools.ask",
  "akasha.tools.summary",
  "akasha.agent",
  "akasha.RAG",
]
omit = [
  "akasha/ui.py",
  "akasha/interface/*",
  "akasha/api.py",
  "akasha/utils/models/*",
  "akasha/tools/gen_img.py",
  "tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
