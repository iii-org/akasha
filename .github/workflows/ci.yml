name: CI

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-image:
          - ghcr.io/astral-sh/uv:0.6.13-python3.11-bookworm-slim
          - ghcr.io/astral-sh/uv:0.6.13-python3.12-bookworm-slim
    container: ${{ matrix.python-image }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      RUN_LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Show Python version
        run: python -V

      - name: Install dependencies
        run: uv pip install --system -e ".[light,dev]"

      - name: Resolve full dependency profile
        shell: bash
        run: |
          python_version="$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          uv pip compile pyproject.toml --extra full --python-version "${python_version}" --quiet > /dev/null

      - name: Run light, integration, and available live tests
        run: pytest --maxfail=1 --disable-warnings -vv -s -m "not full_only"

  full:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.6.13-python3.11-bookworm-slim
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RUN_LIVE_TESTS: "1"
      HF_HOME: /tmp/huggingface
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential git

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: /tmp/huggingface
          key: gptq-cpu-${{ runner.os }}-python311-v1

      - name: Install full dependencies
        run: uv pip install --system -e ".[full,dev]"

      - name: Run full-only tests
        run: pytest --maxfail=1 --disable-warnings -vv -s -m "full_only"
