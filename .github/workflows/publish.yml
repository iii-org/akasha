name: Publish to PyPI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  build-and-publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag and project version
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z release tag"
            exit 1
          fi

          git fetch origin master --tags
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$tag_sha" != "$TESTED_SHA" ] || [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "Release tag does not point at the commit tested by CI"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_sha" origin/master; then
            echo "Release commit must be merged into master"
            exit 1
          fi

          tag_version="${RELEASE_TAG#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"

          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag version $tag_version does not match pyproject.toml version $project_version"
            exit 1
          fi

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine packaging setuptools wheel

      - name: Build
        run: python -m build

      - name: Check artifacts
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
